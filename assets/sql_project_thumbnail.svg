    <path d="M150 0 V675" stroke="#ffffff" stroke-width="1"/>
    <path d="M350 0 V675" stroke="#ffffff" stroke-width="1"/>
    <path d="M550 0 V675" stroke="#ffffff" stroke-width="1"/>
    <path d="M750 0 V675" stroke="#ffffff" stroke-width="1"/>
    <path d="M950 0 V675" stroke="#ffffff" stroke-width="1"/>
    <path d="M1150 0 V675" stroke="#ffffff" stroke-width="1"/>
  </g>

  <rect x="72" y="82" width="1056" height="511" rx="20" fill="#11191e" stroke="#2b353c" stroke-width="2"/>

  <g>
