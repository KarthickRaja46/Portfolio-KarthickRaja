<svg viewBox="0 0 400 250" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Gradients -->
    <linearGradient id="dbBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a0033;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2d0052;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="dbCyl" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#a78bfa;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8b5cf6;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="healthGood" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#10b981;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#059669;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="healthWarn" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#f97316;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ea580c;stop-opacity:1" />
    </linearGradient>
    <filter id="dbGlow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="400" height="250" fill="url(#dbBg)"/>
  
  <!-- Structure Grid -->
  <g stroke="#6b21a8" stroke-width="0.5" opacity="0.2">
    <line x1="0" y1="62" x2="400" y2="62"/>
    <line x1="0" y1="124" x2="400" y2="124"/>
    <line x1="0" y1="186" x2="400" y2="186"/>
  </g>
  
  <!-- DATABASE CYLINDER (Left) -->
  <g filter="url(#dbGlow)">
    <!-- Top elipse -->
    <ellipse cx="80" cy="55" rx="28" ry="10" fill="url(#dbCyl)" opacity="0.7"/>
    <!-- Left side -->
    <line x1="52" y1="55" x2="52" y2="95" stroke="#a78bfa" stroke-width="2"/>
    <!-- Right side -->
    <line x1="108" y1="55" x2="108" y2="95" stroke="#8b5cf6" stroke-width="2"/>
    <!-- Bottom circle -->
    <ellipse cx="80" cy="95" rx="28" ry="10" fill="url(#dbCyl)" opacity="0.5"/>
    <!-- Inner rings -->
    <ellipse cx="80" cy="65" rx="28" ry="10" fill="none" stroke="#a78bfa" stroke-width="1" opacity="0.4"/>
    <ellipse cx="80" cy="75" rx="28" ry="10" fill="none" stroke="#a78bfa" stroke-width="1" opacity="0.3"/>
  </g>
  
  <!-- ANALYTICS DASHBOARD (Center) -->
  <g>
    <!-- Dashboard frame -->
    <rect x="130" y="45" width="140" height="110" rx="6" fill="#16213e" opacity="0.8" stroke="#6b21a8" stroke-width="1.5"/>
    
    <!-- Query Performance metric -->
    <g>
      <rect x="140" y="55" width="50" height="45" rx="4" fill="#1f2937" opacity="0.9"/>
      <text x="165" y="68" font-family="'JetBrains Mono'" font-size="9" fill="#a78bfa" text-anchor="middle" font-weight="600">Q-Time</text>
      <text x="165" y="85" font-family="'Inter'" font-size="16" fill="#10b981" text-anchor="middle" font-weight="700">42ms</text>
    </g>
    
    <!-- Throughput metric -->
    <g>
      <rect x="200" y="55" width="50" height="45" rx="4" fill="#1f2937" opacity="0.9"/>
      <text x="225" y="68" font-family="'JetBrains Mono'" font-size="9" fill="#a78bfa" text-anchor="middle" font-weight="600">TPS</text>
      <text x="225" y="85" font-family="'Inter'" font-size="16" fill="#10b981" text-anchor="middle" font-weight="700">1.2K</text>
    </g>
    
    <!-- Health indicator -->
    <g>
      <rect x="140" y="105" width="110" height="10" rx="5" fill="#374151" opacity="0.8"/>
      <rect x="140" y="105" width="82" height="10" rx="5" fill="url(#healthGood)" opacity="0.9"/>
      <text x="260" y="113" font-family="'JetBrains Mono'" font-size="8" fill="#10b981" font-weight="600">98%</text>
    </g>
  </g>
  
  <!-- ALERTS/LOGS (Right) -->
  <g filter="url(#dbGlow)">
    <!-- Alert Box 1 - Good -->
    <circle cx="300" cy="65" r="8" fill="#10b981" opacity="0.85"/>
    <g font-family="'JetBrains Mono'" font-size="8" fill="#e5e7eb">
      <text x="315" y="68">✓ Sync OK</text>
    </g>
    
    <!-- Alert Box 2 - Warning -->
    <circle cx="300" cy="90" r="8" fill="#f97316" opacity="0.85"/>
    <g font-family="'JetBrains Mono'" font-size="8" fill="#e5e7eb">
      <text x="315" y="93">⚠ High CPU</text>
    </g>
    
    <!-- Alert Box 3 - Good -->
    <circle cx="300" cy="115" r="8" fill="#10b981" opacity="0.85"/>
    <g font-family="'JetBrains Mono'" font-size="8" fill="#e5e7eb">
      <text x="315" y="118">✓ ETL Done</text>
    </g>
  </g>
  
  <!-- Performance Chart (Bottom) -->
  <g>
    <polyline points="50,165 90,150 130,140 170,155 210,135 250,145 290,125 330,140" 
              fill="none" stroke="#a78bfa" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Baseline -->
    <line x1="45" y1="170" x2="340" y2="170" stroke="#6b21a8" stroke-width="1" opacity="0.5" stroke-dasharray="2,2"/>
    
    <!-- Labels -->
    <g font-family="'JetBrains Mono'" font-size="8" fill="#9ca3af">
      <text x="50" y="190">1h</text>
      <text x="165" y="190">4h</text>
      <text x="290" y="190">8h</text>
    </g>
  </g>
  
  <!-- Title -->
  <g font-family="'Inter'" font-size="10" fill="#c084fc" font-weight="600" opacity="0.9">
    <text x="10" y="225">MySQL Performance Monitor</text>
  </g>
  
  <!-- Live indicator -->
  <g>
    <circle cx="380" cy="225" r="3" fill="#10b981" opacity="0.9"/>
    <circle cx="380" cy="225" r="3" fill="#10b981" opacity="0.5">
      <animate attributeName="r" from="3" to="7" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" from="0.5" to="0" dur="2s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
