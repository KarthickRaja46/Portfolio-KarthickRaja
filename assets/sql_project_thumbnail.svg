      <text x="16" y="32" fill="#8ea0ad" font-family="Inter, Arial, sans-serif" font-size="17">Errors</text>
      <text x="16" y="66" fill="#d4b88b" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="700">2.4%</text>

