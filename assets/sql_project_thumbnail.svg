  </g>

  <g transform="translate(108,198)">
    <ellipse cx="165" cy="22" rx="120" ry="30" fill="#182228" stroke="url(#gold)" stroke-width="4"/>
    <rect x="45" y="22" width="240" height="130" fill="#182228" stroke="url(#gold)" stroke-width="4"/>
    <ellipse cx="165" cy="152" rx="120" ry="30" fill="#182228" stroke="url(#gold)" stroke-width="4"/>
    <ellipse cx="165" cy="87" rx="120" ry="30" fill="none" stroke="#6d5b40" stroke-width="2" opacity="0.6"/>
    <ellipse cx="165" cy="119" rx="120" ry="30" fill="none" stroke="#6d5b40" stroke-width="2" opacity="0.4"/>
