<svg viewBox="0 0 400 250" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Dynamic Gradients -->
    <linearGradient id="stockBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0e27;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a1f3a;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="bullish" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" style="stop-color:#10b981;stop-opacity:0.1" />
      <stop offset="100%" style="stop-color:#34d399;stop-opacity:0.9" />
    </linearGradient>
    <linearGradient id="bullishLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#059669;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#34d399;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="candleGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#f9a825;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f97316;stop-opacity:1" />
    </linearGradient>
    <filter id="glow1">
      <feGaussianBlur stdDeviation="1.5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="400" height="250" fill="url(#stockBg)"/>
  
  <!-- Grid background -->
  <g stroke="#3a4563" stroke-width="0.5" opacity="0.3">
    <line x1="0" y1="62" x2="400" y2="62"/>
    <line x1="0" y1="124" x2="400" y2="124"/>
    <line x1="0" y1="186" x2="400" y2="186"/>
    <line x1="100" y1="0" x2="100" y2="250"/>
    <line x1="200" y1="0" x2="200" y2="250"/>
    <line x1="300" y1="0" x2="300" y2="250"/>
  </g>
  
  <!-- Axes -->
  <line x1="40" y1="30" x2="40" y2="210" stroke="#6b7280" stroke-width="2"/>
  <line x1="40" y1="210" x2="380" y2="210" stroke="#6b7280" stroke-width="2"/>
  
  <!-- Main Candlesticks -->
  <g filter="url(#glow1)">
    <!-- Candle 1 (Red) -->
    <line x1="70" y1="110" x2="70" y2="160" stroke="#ef4444" stroke-width="2"/>
    <rect x="60" y="130" width="20" height="20" fill="#ef4444" opacity="0.8"/>
    
    <!-- Candle 2 (Green) -->
    <line x1="110" y1="95" x2="110" y2="155" stroke="#10b981" stroke-width="2"/>
    <rect x="100" y="110" width="20" height="25" fill="#10b981" opacity="0.85"/>
    
    <!-- Candle 3 (Green) -->
    <line x1="150" y1="80" x2="150" y2="150" stroke="#34d399" stroke-width="2"/>
    <rect x="140" y="90" width="20" height="30" fill="#34d399" opacity="0.9"/>
    
    <!-- Candle 4 (Green) -->
    <line x1="190" y1="65" x2="190" y2="140" stroke="#6ee7b7" stroke-width="2"/>
    <rect x="180" y="75" width="20" height="35" fill="#6ee7b7" opacity="0.9"/>
    
    <!-- Candle 5 (Orange) -->
    <line x1="230" y1="55" x2="230" y2="135" stroke="#f97316" stroke-width="2"/>
    <rect x="220" y="65" width="20" height="38" fill="#f97316" opacity="0.85"/>
  </g>
  
  <!-- Price Line Chart overlay -->
  <polyline points="55,165 85,145 115,125 145,105 175,85 205,70 235,60" 
            fill="none" stroke="url(#bullishLine)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Area under curve -->
  <defs>
    <linearGradient id="areaGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#34d399;stop-opacity:0.4" />
      <stop offset="100%" style="stop-color:#34d399;stop-opacity:0.05" />
    </linearGradient>
  </defs>
  <path d="M 55 165 L 85 145 L 115 125 L 145 105 L 175 85 L 205 70 L 235 60 L 235 210 L 55 210 Z" 
        fill="url(#areaGrad)"/>
  
  <!-- Data points -->
  <circle cx="85" cy="145" r="2.5" fill="#34d399"/>
  <circle cx="145" cy="105" r="2.5" fill="#34d399"/>
  <circle cx="205" cy="70" r="2.5" fill="#34d399"/>
  <circle cx="235" cy="60" r="2.5" fill="#34d399" filter="url(#glow1)"/>
  
  <!-- Portfolio Metrics -->
  <g>
    <!-- Current Value -->
    <g font-family="'Inter', sans-serif">
      <text x="270" y="95" font-size="11" fill="#9ca3af" opacity="0.7">Current</text>
      <text x="270" y="115" font-size="18" font-weight="700" fill="#34d399">$24,580</text>
    </g>
    
    <!-- Gain -->
    <g font-family="'JetBrains Mono', monospace">
      <text x="270" y="145" font-size="10" fill="#6b7280">Gain: </text>
      <text x="310" y="145" font-size="10" font-weight="600" fill="#10b981">+18.5%</text>
    </g>
    
    <!-- Status -->
    <g>
      <circle cx="274" cy="170" r="3" fill="#10b981"/>
      <text x="285" y="173" font-size="9" fill="#9ca3af">Market Active</text>
    </g>
  </g>
</svg>